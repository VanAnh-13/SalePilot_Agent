<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
  <ns0:defs>
    <ns0:filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <ns0:feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" result="noise" />
      <ns0:feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </ns0:filter>
    <ns0:marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <ns0:path d="M 0 1 L 10 5 L 0 9 Z" fill="#2d3748" filter="url(#rough)" />
    </ns0:marker>
    <ns0:marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <ns0:path d="M 0 1 L 10 5 L 0 9 Z" fill="#0284c7" filter="url(#rough)" />
    </ns0:marker>
    <ns0:style>
      700&amp;display=swap');
      text { font-family: 'Segoe Print', 'Comic Neue', 'Comic Sans MS', cursive, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #1a202c; }
      .subtitle { font-size: 21px; fill: #4a5568; }
      .lane { font-size: 22px; font-weight: 700; fill: #2d3748; letter-spacing: 1.5px; }
      .stepN { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .boxTitle { font-size: 24px; font-weight: 700; fill: #1a202c; }
      .body { font-size: 20px; fill: #2d3748; }
      .edge { stroke: #2d3748; stroke-width: 3; fill: none; marker-end: url(#arrow); filter: url(#rough); }
      .blueEdge { stroke: #0284c7; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); filter: url(#rough); }
      .box { filter: url(#rough); stroke-linecap: round; stroke-linejoin: round; }
    </ns0:style>
  </ns0:defs>

  <ns0:rect width="1500" height="780" fill="#fcfbf9" />

  <ns0:text class="title" x="50" y="52">Nominal Decision Workflow</ns0:text>
  <ns0:text class="subtitle" x="50" y="85">✏️ Non-streaming order; separate commits; catalog grounding applies to recommendation route</ns0:text>

  <ns0:text class="lane" x="50" y="130">STAGE 1: INGRESS &amp; ROUTING</ns0:text>
  
  <ns0:g transform="translate(50 148)" class="box">
    <ns0:rect width="260" height="110" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" />
    <ns0:circle cx="32" cy="35" r="20" fill="#0284c7" />
    <ns0:text class="stepN" x="25" y="43">1</ns0:text>
    <ns0:text class="boxTitle" x="65" y="42">Verify Channel</ns0:text>
    <ns0:text class="body" x="25" y="82">Session / webhook</ns0:text>
  </ns0:g>
  
  <ns0:path class="edge" d="M 310 203 L 345 203" />

  <ns0:g transform="translate(350 148)" class="box">
    <ns0:rect width="280" height="110" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" />
    <ns0:circle cx="32" cy="35" r="20" fill="#0284c7" />
    <ns0:text class="stepN" x="25" y="43">2</ns0:text>
    <ns0:text class="boxTitle" x="65" y="42">Lock Identity</ns0:text>
    <ns0:text class="body" x="25" y="82">Serialize turn</ns0:text>
  </ns0:g>

  <ns0:path class="edge" d="M 630 203 L 665 203" />

  <ns0:g transform="translate(670 148)" class="box">
    <ns0:rect width="320" height="110" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="3" />
    <ns0:circle cx="32" cy="35" r="20" fill="#9333ea" />
    <ns0:text class="stepN" x="25" y="43">3</ns0:text>
    <ns0:text class="boxTitle" x="65" y="42">Append &amp; Load</ns0:text>
    <ns0:text class="body" x="25" y="82">User message &amp; memory</ns0:text>
  </ns0:g>

  <ns0:path class="edge" d="M 990 203 L 1045 203" />

  <ns0:g transform="translate(1050 135)" class="box">
    <ns0:polygon points="180,0 360,68 180,136 0,68" fill="#ffedd5" stroke="#ea580c" stroke-width="3" />
    <ns0:text class="boxTitle" text-anchor="middle" x="180" y="60">4. Route Request</ns0:text>
    <ns0:text class="body" text-anchor="middle" x="180" y="90">Clear product need?</ns0:text>
  </ns0:g>

  <ns0:text class="lane" x="50" y="305">STAGE 2: DECISION PATHWAYS</ns0:text>

  <!-- Deterministic path -->
  <ns0:rect class="box" x="50" y="325" width="360" height="160" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3" />
  <ns0:text class="boxTitle" x="75" y="365">Typed Need Route</ns0:text>
  <ns0:text class="body" x="75" y="405">• Parse &amp; merge typed slots</ns0:text>
  <ns0:text class="body" x="75" y="438">• Choose typed action</ns0:text>
  <ns0:text class="body" x="75" y="470">• Save need; best-effort CRM</ns0:text>

  <ns0:path class="blueEdge" d="M 1180 260 C 1100 290 700 290 410 325" />

  <ns0:path class="blueEdge" d="M 410 405 L 455 405" />

  <ns0:rect class="box" x="460" y="325" width="320" height="160" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3" />
  <ns0:text class="boxTitle" x="485" y="365">Retrieve &amp; Rank</ns0:text>
  <ns0:text class="body" x="485" y="405">• Catalog hard-filter check</ns0:text>
  <ns0:text class="body" x="485" y="438">• Deterministic scoring</ns0:text>
  <ns0:text class="body" x="485" y="470">• Top-3 grounded SKUs</ns0:text>

  <!-- LLM Orchestration path -->
  <ns0:rect class="box" x="850" y="325" width="600" height="160" rx="18" fill="#faf5ff" stroke="#a855f7" stroke-width="3" />
  <ns0:text class="boxTitle" x="875" y="365">Lead Orchestrator &amp; Sub-Agents</ns0:text>
  <ns0:text class="body" x="875" y="405">• Delegate tool calls: Catalog, Knowledge, CRM, Order</ns0:text>
  <ns0:text class="body" x="875" y="438">• Free-form conversational response generation</ns0:text>
  <ns0:text class="body" x="875" y="470">• Finalize response payload</ns0:text>

  <ns0:path class="edge" d="M 1270 260 L 1270 325" />

  <ns0:text class="lane" x="50" y="535">STAGE 3: ASSEMBLY, EXPORT &amp; RETURN</ns0:text>

  <ns0:rect class="box" x="50" y="555" width="410" height="160" rx="18" fill="#fef9c3" stroke="#ca8a04" stroke-width="3" />
  <ns0:text class="boxTitle" x="75" y="598">Reply Assembly &amp; Contract</ns0:text>
  <ns0:text class="body" x="75" y="638">• Format ground evidence payload</ns0:text>
  <ns0:text class="body" x="75" y="675">• Combine decision &amp; text reply</ns0:text>

  <ns0:path class="edge" d="M 620 485 C 620 520 255 520 255 555" />
  <ns0:path class="edge" d="M 1150 485 C 1150 520 460 520 460 555" />

  <ns0:path class="edge" d="M 460 635 L 505 635" />

  <ns0:rect class="box" x="510" y="555" width="440" height="160" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="3" />
  <ns0:text class="boxTitle" x="535" y="598">Research Telemetry Export</ns0:text>
  <ns0:text class="body" x="535" y="638">• HMAC external ID pseudonymization</ns0:text>
  <ns0:text class="body" x="535" y="675">• Await background audit logger</ns0:text>

  <ns0:path class="edge" d="M 950 635 L 995 635" />

  <ns0:rect class="box" x="1000" y="555" width="450" height="160" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" />
  <ns0:text class="boxTitle" x="1025" y="598">Persist &amp; Channel Delivery</ns0:text>
  <ns0:text class="body" x="1025" y="638">• Commit assistant message &amp; unlock</ns0:text>
  <ns0:text class="body" x="1025" y="675">• Return HTTP response / Zalo delivery</ns0:text>
</ns0:svg>