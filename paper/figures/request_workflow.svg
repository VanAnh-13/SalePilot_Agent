<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#2d3748" filter="url(#rough)"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#0284c7" filter="url(#rough)"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&amp;display=swap');
      text { font-family: 'Segoe Print', 'Comic Neue', 'Comic Sans MS', cursive, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #1a202c; }
      .subtitle { font-size: 21px; fill: #4a5568; }
      .lane { font-size: 22px; font-weight: 700; fill: #2d3748; letter-spacing: 1.5px; }
      .stepN { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .boxTitle { font-size: 24px; font-weight: 700; fill: #1a202c; }
      .body { font-size: 20px; fill: #2d3748; }
      .edge { stroke: #2d3748; stroke-width: 3; fill: none; marker-end: url(#arrow); filter: url(#rough); }
      .blueEdge { stroke: #0284c7; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); filter: url(#rough); }
      .box { filter: url(#rough); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1500" height="780" fill="#fcfbf9"/>

  <text class="title" x="50" y="52">Nominal Decision Workflow</text>
  <text class="subtitle" x="50" y="85">✏️ Non-streaming order; separate commits; catalog grounding applies to recommendation route</text>

  <text class="lane" x="50" y="130">STAGE 1: INGRESS &amp; ROUTING</text>
  
  <g transform="translate(50 148)" class="box">
    <rect width="260" height="110" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <circle cx="32" cy="35" r="20" fill="#0284c7"/>
    <text class="stepN" x="25" y="43">1</text>
    <text class="boxTitle" x="65" y="42">Verify Channel</text>
    <text class="body" x="25" y="82">Session / webhook</text>
  </g>
  
  <path class="edge" d="M 310 203 L 345 203"/>

  <g transform="translate(350 148)" class="box">
    <rect width="280" height="110" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <circle cx="32" cy="35" r="20" fill="#0284c7"/>
    <text class="stepN" x="25" y="43">2</text>
    <text class="boxTitle" x="65" y="42">Lock Identity</text>
    <text class="body" x="25" y="82">Serialize turn</text>
  </g>

  <path class="edge" d="M 630 203 L 665 203"/>

  <g transform="translate(670 148)" class="box">
    <rect width="320" height="110" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
    <circle cx="32" cy="35" r="20" fill="#9333ea"/>
    <text class="stepN" x="25" y="43">3</text>
    <text class="boxTitle" x="65" y="42">Append &amp; Load</text>
    <text class="body" x="25" y="82">User message &amp; memory</text>
  </g>

  <path class="edge" d="M 990 203 L 1045 203"/>

  <g transform="translate(1050 135)" class="box">
    <polygon points="180,0 360,68 180,136 0,68" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text class="boxTitle" text-anchor="middle" x="180" y="60">4. Route Request</text>
    <text class="body" text-anchor="middle" x="180" y="90">Clear product need?</text>
  </g>

  <text class="lane" x="50" y="305">STAGE 2: DECISION PATHWAYS</text>

  <!-- Deterministic path -->
  <rect class="box" x="50" y="325" width="360" height="160" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text class="boxTitle" x="75" y="365">Typed Need Route</text>
  <text class="body" x="75" y="405">• Parse &amp; merge typed slots</text>
  <text class="body" x="75" y="438">• Choose typed action</text>
  <text class="body" x="75" y="470">• Save need; best-effort CRM</text>

  <path class="blueEdge" d="M 1180 260 C 1100 290 700 290 410 325"/>

  <path class="blueEdge" d="M 410 405 L 455 405"/>

  <rect class="box" x="460" y="325" width="320" height="160" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text class="boxTitle" x="485" y="365">Retrieve &amp; Rank</text>
  <text class="body" x="485" y="405">• Catalog hard-filter check</text>
  <text class="body" x="485" y="438">• Deterministic scoring</text>
  <text class="body" x="485" y="470">• Top-3 grounded SKUs</text>

  <!-- LLM Orchestration path -->
  <rect class="box" x="850" y="325" width="600" height="160" rx="18" fill="#faf5ff" stroke="#a855f7" stroke-width="3"/>
  <text class="boxTitle" x="875" y="365">Lead Orchestrator &amp; Sub-Agents</text>
  <text class="body" x="875" y="405">• Delegate tool calls: Catalog, Knowledge, CRM, Order</text>
  <text class="body" x="875" y="438">• Free-form conversational response generation</text>
  <text class="body" x="875" y="470">• Finalize response payload</text>

  <path class="edge" d="M 1270 260 L 1270 325"/>

  <text class="lane" x="50" y="535">STAGE 3: ASSEMBLY, EXPORT &amp; RETURN</text>

  <rect class="box" x="50" y="555" width="410" height="160" rx="18" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/>
  <text class="boxTitle" x="75" y="598">Reply Assembly &amp; Contract</text>
  <text class="body" x="75" y="638">• Format ground evidence payload</text>
  <text class="body" x="75" y="675">• Combine decision &amp; text reply</text>

  <path class="edge" d="M 620 485 C 620 520 255 520 255 555"/>
  <path class="edge" d="M 1150 485 C 1150 520 460 520 460 555"/>

  <path class="edge" d="M 460 635 L 505 635"/>

  <rect class="box" x="510" y="555" width="440" height="160" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>
  <text class="boxTitle" x="535" y="598">Research Telemetry Export</text>
  <text class="body" x="535" y="638">• HMAC external ID pseudonymization</text>
  <text class="body" x="535" y="675">• Await background audit logger</text>

  <path class="edge" d="M 950 635 L 995 635"/>

  <rect class="box" x="1000" y="555" width="450" height="160" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text class="boxTitle" x="1025" y="598">Persist &amp; Channel Delivery</text>
  <text class="body" x="1025" y="638">• Commit assistant message &amp; unlock</text>
  <text class="body" x="1025" y="675">• Return HTTP response / Zalo delivery</text>
</svg>